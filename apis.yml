aid: figure-technology-solutions
name: Figure Technology Solutions
description: 'Figure Technology Solutions is a Reno, Nevada financial-technology company
  (founded 2018) that builds and operates blockchain-based platforms for lending, capital
  markets, and asset management. Its public Partner APIs let integrators originate and
  manage Home Equity Line of Credit (HELOC) loans end to end: non-licensed pre-qualification
  and offer retrieval, full HELOC inquiry lifecycle management (start inquiry, select
  property, add income/SSN, verify liens, select offer, documents), loan-originator
  directory management, and Portfolio Manager reporting over owned and pledged loan
  pools. Figure also runs Figure Connect, a blockchain-based loan marketplace connecting
  loan sellers and buyers. The REST/JSON APIs authenticate with an apikey header and
  protect PII in transit with JWE encryption (RSA-OAEP-256 + A256GCM).'
