summary:
  types:
  - apiKey
  api_key_in:
  - header
  notes: >-
    Every Figure Partner API request requires two headers: an `apikey` header
    carrying the key Figure supplies to the partner, and a `User-Agent` header.
    Requests without both headers are rejected. The Portfolio Manager and HELOC
    Inquiries APIs declare/document the `apikey` header scheme; the HELOC
    Pre-Qualification API is keyed by an `affiliateId` supplied by Figure.
    Request/response payloads carrying PII may additionally be JWE-encrypted
    (RSA-OAEP-256 + A256GCM) — see conventions/ and security docs.
